unbind C-b
set -g prefix C-t
bind C-t send-prefix
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',xterm-256color:Tc'
set -g focus-events on
set -g history-limit 100000
set -g set-clipboard on
set -g allow-passthrough on
set -g renumber-windows on
set -sg escape-time 10
set -g set-titles on
set -g set-titles-string '#T'

if-shell 'test "$(uname -s)" = Darwin' 'source-file ~/.config/tmux/macos.conf'
source-file ~/.config/tmux/bindings.conf
source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/statusline.conf
source-file ~/.config/tmux/utility.conf
source-file -q ~/.config/tmux/tmux-private.conf
