# Global mise config for macOS and Linux (linked to ~/.config/mise/config.toml).
# Windows does not use mise: the same tools come from Scoop (packages/scoop.txt).
# Keep these versions in step with what Scoop installs so every OS matches.
[settings]
auto_install = false
http_timeout = "10m"
# Pins below may be newer than the default release-age quarantine; allow them.
minimum_release_age = "0"

[tools]
go = "1.27.1"
rust = { version = "stable", profile = "minimal" }
python = "3.14.8"
node = "26.10.0"
pnpm = "12.9.1"
bun = "1.4.2"
uv = "0.12.23"
neovim = "0.12.5"
starship = "1.26.0"
fzf = "0.74.4"
just = "1.58.0"
gh = "2.102.0"
jq = "1.8.2"
ripgrep = "15.1.0"
fd = "10.3.0"
"conda:conda" = "26.7.3"
