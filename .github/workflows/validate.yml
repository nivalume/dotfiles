name: Validate dotfiles

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chezmoi
        run: go install github.com/twpayne/chezmoi/v2@latest
      - name: Add chezmoi to PATH
        shell: python
        run: |
          import os, pathlib, subprocess
          gopath = subprocess.check_output(["go", "env", "GOPATH"], text=True).strip()
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path:
              print(pathlib.Path(gopath) / "bin", file=path)
      - name: Validate deployment and migration
        run: python tests/smoke.py -v
