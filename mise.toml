[settings]
auto_install = false
http_timeout = "10m"
dotfiles.root = "~/.dotfiles"

[env]
_.file = { path = "~/.config/mise/.env", redact = true }
_.path = ["{{env.HOME}}/.local/bin", "{{env.HOME}}/.local/share/pnpm/bin"]
EDITOR = { default = "nvim" }
VISUAL = { default = "nvim" }
PAGER = { default = "less" }
LESS = { default = "-FRX" }
XDG_CONFIG_HOME = { default = "{{env.HOME}}/.config" }
XDG_CACHE_HOME = { default = "{{env.HOME}}/.cache" }
XDG_DATA_HOME = { default = "{{env.HOME}}/.local/share" }
PNPM_HOME = { default = "{{env.HOME}}/.local/share/pnpm" }
MISE_RUSTUP_HOME = "{{env.HOME}}/.local/share/mise/rustup"
MISE_CARGO_HOME = "{{env.HOME}}/.local/share/mise/cargo"
CONDA_ENVS_PATH = "{{env.HOME}}/.conda/envs"
CONDA_PKGS_DIRS = "{{env.HOME}}/.conda/pkgs"

[tools]
go = "1.26.4"
rust = { version = "1.96.0", profile = "minimal" }
python = "3.14.6"
node = "26.8.1"
pnpm = "11.25.0"
bun = "1.4.0"
uv = "0.11.33"
neovim = "0.12.1"
starship = "1.24.2"
fzf = "0.71.0"
just = "1.58.0"
gh = "2.92.0"
jq = "1.7.1"
ripgrep = "15.1.0"
fd = "10.4.2"
"npm:@openai/codex" = "0.155.1"
"npm:@xai-official/grok" = "1.0.24"
"npm:@anthropic-ai/claude-code" = "2.1.198"
"conda:conda" = "26.7.3"

[bootstrap.packages]
"brew:zsh" = { os = "macos" }
"brew:git" = { os = "macos" }
"pacman:zsh" = { os = "linux" }
"pacman:git" = { os = "linux" }
"apt:zsh" = { os = "linux" }
"scoop:git" = { os = "windows" }
"scoop:zoxide" = { os = "windows" }
"scoop:eza" = { os = "windows" }
"scoop:bat" = { os = "windows" }

[bootstrap.repos]
"~/.local/share/zsh/plugins/z" = { url = "https://github.com/rupa/z.git" }
"~/.local/share/zsh/spaceship-prompt" = { url = "https://github.com/spaceship-prompt/spaceship-prompt.git" }
"~/.local/share/zsh/plugins/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions.git" }
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }
"~/.local/share/zsh/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }

[dotfiles]
"~/Library/Application Support/Code/User/settings.json" = {
  source = "~/.dotfiles/dotfiles/.config/Code/User/settings.json",
mode = "symlink",
variants = [{ os = "macos" }],
}
"~/.config/mise/config.toml" = { source = "~/.dotfiles/mise.toml", mode = "symlink" }
"~/.config/mise/.env.example" = { source = "~/.dotfiles/.env.example", mode = "copy" }
"~/.local/share/mise/shell/bashrc" = { source = "~/.dotfiles/dotfiles/.bashrc", mode = "copy" }
"~/.bash_profile" = { source = "~/.dotfiles/dotfiles/.bash_profile", mode = "symlink", variants = [
  { os = "unix" },
] }
"~/.bashrc/mise-dotfiles" = { block = '[[ -r "$HOME/.local/share/mise/shell/bashrc" ]] && source "$HOME/.local/share/mise/shell/bashrc"' }
"~/.zshenv" = { source = "~/.dotfiles/dotfiles/.zshenv", mode = "symlink", variants = [
  { os = "unix" },
] }
"~/.zprofile" = { source = "~/.dotfiles/dotfiles/.zprofile", mode = "symlink", variants = [
  { os = "unix" },
] }
"~/.zshrc" = { source = "~/.dotfiles/dotfiles/.zshrc", mode = "symlink", variants = [
  { os = "unix" },
] }
"~/.ticker.yaml" = { source = "~/.dotfiles/dotfiles/.ticker.yaml", mode = "symlink" }
"~/.config/codex-flags.conf" = { source = "~/.dotfiles/dotfiles/.config/codex-flags.conf", mode = "symlink" }
"~/.config/starship.toml" = { source = "~/.dotfiles/dotfiles/.config/starship.toml", mode = "symlink" }
"~/.condarc" = { source = "~/.dotfiles/dotfiles/.condarc", mode = "symlink" }
"~/.grok/config.toml" = { source = "~/.dotfiles/dotfiles/.grok/config.toml", mode = "symlink" }
"~/.config/nvim" = { source = "~/.dotfiles/dotfiles/.config/nvim", mode = "symlink" }
"~/.config/zsh" = { source = "~/.dotfiles/dotfiles/.config/zsh", mode = "symlink", variants = [
  { os = "unix" },
] }
"~/.config/shell" = { source = "~/.dotfiles/dotfiles/.config/shell", mode = "symlink", variants = [
  { os = "unix" },
] }

[dotfiles."~/.config/hypr"]
source = "~/.dotfiles/dotfiles/.config/hypr"
mode = "symlink"
variants = [{ os = "linux" }]

[dotfiles."~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1"]
source = "~/.dotfiles/dotfiles/Documents/PowerShell/Microsoft.PowerShell_profile.ps1"
mode = "symlink"
variants = [{ os = "windows" }]

[dotfiles."~/.wslconfig"]
source = "~/.dotfiles/dotfiles/.wslconfig"
mode = "symlink"
variants = [{ os = "windows" }]
